buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

// Versions come from the host app's root ext block (standard RN template).
def safeExtGet(prop, fallback) {
    rootProject.hasProperty(prop) ? rootProject.getProperty(prop) : fallback
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

android {
    namespace "com.rasenjs.rnhtml"
    compileSdk safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation("com.facebook.react:react-android")
}
